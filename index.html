<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lamp</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: system-ui, sans-serif;
    }
    button {
      width: 60vmin;
      height: 60vmin;
      border: none;
      border-radius: 50%;
      font-size: 8vmin;
      color: #fff;
      background: #444;
    }
    button.on {
      background: #f5b301;
      color: #111;
    }
  </style>
</head>
<body>
  <button id="lamp">...</button>

  <script>
    const button = document.getElementById("lamp");

    function show(isOn) {
      button.textContent = isOn ? "ON" : "OFF";
      button.classList.toggle("on", isOn);
    }

    async function request(url, method) {
      button.disabled = true;
      try {
        const response = await fetch(url, { method });
        if (!response.ok) throw new Error(response.status);
        const data = await response.json();
        show(data.on);
      } catch (error) {
        button.textContent = "Error";
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", () => request("/toggle", "POST"));
    request("/state", "GET");
  </script>
</body>
</html>
